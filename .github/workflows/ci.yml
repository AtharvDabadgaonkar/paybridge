name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate the synthetic dataset
        run: python scripts/generate_data.py

      - name: Train the FraudLens model
        run: python scripts/train_model.py

      - name: Run the test suite
        run: python -m pytest -q --maxfail=5

      - name: Print the verified results report
        run: python scripts/report.py

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-py${{ matrix.python-version }}
          path: |
            data/qa_results.json
            models/fraudlens_metrics.json
          if-no-files-found: ignore

  app-smoke:
    name: Streamlit app smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify every page renders
        run: python -m pytest tests/test_app_smoke.py -q
